<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Artelico Web</title>
  <meta name="description" content="Vision and language models running in your browser. Nothing leaves this computer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%23401a5c'/><text x='14' y='44' font-family='system-ui' font-weight='700' font-size='34' fill='white'>a<tspan fill='%23fa9e6b'>.</tspan></text></svg>">
