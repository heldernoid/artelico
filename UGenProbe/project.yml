name: UGenProbe
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "9"
packages:
  UGenKit:
    path: ../UGenKit
targets:
  UGenProbe:
    type: application
    platform: iOS
    sources:
      - App
      # The UGen300 demo screens, shared with Artelico (ExampleSupport.swift runs them on the stick).
      - path: ../Artelico/App/Examples
        group: App
      # Bundled with the app: the runtime image the stick needs at every power-up, and a sample photo.
      # Models are downloaded on the iPad the first time they are used.
      - path: ../images/core-image-hailo-hailo10-usb-dongle.ext4
        buildPhase: resources
      - path: Samples
        buildPhase: resources
    dependencies:
      # The driver is for iPadOS only; the Mac build talks to the stick through IOKit.
      - target: UGenDriver
        platformFilter: iOS
      - package: UGenKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hailo Studio
        NSCameraUsageDescription: The camera picture is sent to the UGen300 stick for live detection. Nothing leaves the iPad.
        NSLocalNetworkUsageDescription: Lets other devices on your network use the stick through this iPad's REST API.
        NSMicrophoneUsageDescription: Records speech to turn it into text on the UGen300 stick. Nothing leaves the iPad.
        NSPhotoLibraryAddUsageDescription: Saves the recordings you choose to your photo library.
        # Many public traffic cameras are served over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        # Lets the Files app show this app's folder, so model files can be copied in by hand.
        LSSupportsOpeningDocumentsInPlace: true
        # `-api` on the command line starts the REST API at launch (used for testing from the Mac).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # The identifier keeps the old name so installed copies (enabled driver, downloaded models) carry over.
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.UGenProbe
        PRODUCT_NAME: Hailo Studio
        PRODUCT_MODULE_NAME: HailoStudio
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/UGenProbe.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/UGenProbe-Mac.entitlements
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
  UGenDriver:
    type: driver-extension
    platform: iOS
    sources:
      - path: Driver
      - path: Shared
    dependencies:
      - sdk: DriverKit.framework
      - sdk: USBDriverKit.framework
    info:
      path: Driver/Info.plist
      properties:
        CFBundleDisplayName: UGen300 Driver
        # Required: without it iPadOS lists the driver in Settings but never starts it.
        CFBundlePackageType: DEXT
        OSBundleUsageDescription: Communicates with the ASUS UGen300 USB AI accelerator.
        IOKitPersonalities:
          UGenDriver:
            CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleIdentifierKernel: com.apple.kpi.iokit
            IOClass: IOUserService
            IOProviderClass: IOUSBHostDevice
            IOUserClass: UGenDriver
            IOUserServerName: $(PRODUCT_BUNDLE_IDENTIFIER)
            idVendor: 2821
            idProduct: 7535
            UserClientProperties:
              IOClass: IOUserUserClient
              IOUserClass: UGenUserClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.UGenProbe.driver
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        CODE_SIGN_ENTITLEMENTS: Driver/UGenDriver.entitlements
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        RUN_CLANG_STATIC_ANALYZER: YES
