name: Artelico
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Only the stick-free part of the shared library: Artelico has no stick code in it.
  UGenKit:
    path: ../UGenKit
  # Whisper speech-to-text on the Neural Engine (Argmax, MIT). Models: huggingface.co/argmaxinc/whisperkit-coreml
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
targets:
  Artelico:
    type: application
    platform: iOS
    sources:
      - App
      - path: Samples
        buildPhase: resources
    dependencies:
      - package: UGenKit
        product: StudioCore
      - package: ArgmaxOSS
        product: WhisperKit
      # llama.cpp b12138 (commit f7b41cc), built from source with an added Mac Catalyst slice:
      # native/tools/build_llama_xcframework.sh. No RPC backend.
      - framework: ../vendor/llama-b12138-artelico/llama.xcframework
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Artelico
        NSCameraUsageDescription: The camera picture is analysed on this device. Nothing leaves it.
        NSLocalNetworkUsageDescription: Lets other devices on your network use this device's REST API.
        NSMicrophoneUsageDescription: Records speech to turn it into text on this device. Nothing leaves it.
        NSPhotoLibraryAddUsageDescription: Saves the recordings you choose to your photo library.
        NSLocationWhenInUseUsageDescription: The voice assistant uses your location to work out travel times from where you are.
        # Many public traffic cameras are served over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        # Lets the Files app show this app's folder, so model files can be copied in by hand.
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.Artelico
        PRODUCT_NAME: Artelico
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Artelico-Mac.entitlements
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
      configs:
        # Debug Mac builds may read and write the project's model folders (for -modelsfolder in tests).
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Artelico-Mac-Debug.entitlements
